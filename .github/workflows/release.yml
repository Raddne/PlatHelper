name: Release

# Push a tag like v0.1.1 (or create a release with a new tag in the GitHub UI) and
# this builds the Windows installer, a portable zip, the Linux AppImage, .deb and
# .rpm plus the Linux install script, and publishes them. The version needs a
# "## v<version>" section in CHANGELOG.md first: those bullet points become the
# patch notes on top of the release. "Run workflow" does the same for a version
# typed in by hand, creating the tag on the chosen branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # Start of every release file name, from the artifactName patterns in package.json.
  ASSET_PREFIX: PlatHelper

jobs:
  # Before anything slow: a bad version or a release without patch notes stops
  # here, not after two builds.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like 0.1.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Patch notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null

  build-windows:
    needs: prepare
    runs-on: windows-latest
    # Normally well under 15 min; a stalled runner should go red, not sit for 6 hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version. Must run before install: editing package.json
      # afterwards makes pnpm re-sync deps inside the next `pnpm run`, which has
      # wedged Windows runners.
      - name: Set version from tag
        shell: bash
        run: pnpm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release gates itself instead of reading CI's check runs, so a tag on
      # a commit CI never saw (edited on github.com, Actions enabled later) still
      # cannot ship broken code.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # No backend or signing secrets: a PlatHelper build talks to the default
      # backend baked into the source and ships unsigned, same as a local build.
      # zip = the unpacked app as a portable download; the installer stays the
      # auto-updater's target, which is why latest.yml only ever names the Setup.exe.
      - name: Build Windows installer and portable zip
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          pnpm exec electron-builder --win nsis zip --publish never

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $productName = (Get-Content package.json | ConvertFrom-Json).build.productName
          pnpm run test:packaged "release/win-unpacked/$productName.exe"

      - name: Preserve failed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-acceptance
          path: test-results/
          if-no-files-found: ignore

      - name: Keep release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            release/latest.yml
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/*-portable.zip

  # latest-linux.yml is what electron-updater reads inside a running AppImage or an
  # installed .deb/.rpm; scripts/install-linux.sh reads it too.
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set version from tag
        run: pnpm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wayland-scanner and the protocol XML are build-time only; without them
      # build-layer-shell skips and the packages ship without the Wayland overlay addon.
      # rpmbuild makes the .rpm.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-bin wayland-protocols rpm

      - name: Build Linux AppImage, deb and rpm
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          node scripts/build-layer-shell.mjs --require
          pnpm exec electron-builder --linux --publish never

      - name: Verify packaged Linux runtime
        run: |
          pnpm exec playwright install-deps chromium
          VERSION=$(node -p "require('./package.json').version")
          xvfb-run -a pnpm run test:packaged "release/$ASSET_PREFIX-$VERSION.AppImage"

      - name: Preserve failed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-acceptance
          path: test-results/
          if-no-files-found: ignore

      - name: Keep release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 3
          path: |
            release/latest-linux.yml
            release/*.AppImage
            release/*.deb
            release/*.rpm

  # Draft first and published last, and only once both platforms built, so
  # nobody (and no auto-updater) ever sees a release missing one of its files.
  publish:
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          PATHS=(
            "release/latest.yml"
            "release/$ASSET_PREFIX-$VERSION-Setup.exe"
            "release/$ASSET_PREFIX-$VERSION-Setup.exe.blockmap"
            "release/$ASSET_PREFIX-$VERSION-portable.zip"
            "release/latest-linux.yml"
            "release/$ASSET_PREFIX-$VERSION.AppImage"
            "release/$ASSET_PREFIX-$VERSION.deb"
            "release/$ASSET_PREFIX-$VERSION.rpm"
          )
          for path in "${PATHS[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error::Missing release asset: $path"
              exit 1
            fi
          done

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PlatHelper $TAG" \
              --draft \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --generate-notes
          else
            # A release made by hand in the UI: keep its text, but never let it go
            # out without the patch notes on top.
            body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            notes=$(cat "$RUNNER_TEMP/release-notes.md")
            if [[ "$body" != *"$notes"* ]]; then
              printf '%s\n\n%s\n' "$notes" "$body" > "$RUNNER_TEMP/release-body.md"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-body.md"
            fi
          fi

          # The one-line Linux install fetches this from releases/latest/download.
          cp scripts/install-linux.sh release/install-linux.sh
          PATHS+=("release/install-linux.sh")

          gh release upload "$TAG" "${PATHS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $TAG"
