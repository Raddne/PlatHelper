name: Release

# Push a tag like v1.0.1 (or create a release with a new tag in the GitHub UI) and
# this builds the Windows installer plus a portable zip and publishes them. "Run workflow" does the
# same for a version typed in by hand, creating the tag on the chosen branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    # Normally well under 15 min; a stalled runner should go red, not sit for 6 hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like 1.0.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version. Must run before install: editing package.json
      # afterwards makes pnpm re-sync deps inside the next `pnpm run`, which has
      # wedged Windows runners.
      - name: Set version from tag
        shell: bash
        run: pnpm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release gates itself instead of reading CI's check runs, so a tag on
      # a commit CI never saw (edited on github.com, Actions enabled later) still
      # cannot ship broken code.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # No backend or signing secrets: a PlatHelper build talks to the default
      # backend baked into the source and ships unsigned, same as a local build.
      # zip = the unpacked app as a portable download; the installer stays the
      # auto-updater's target, which is why latest.yml only ever names the Setup.exe.
      - name: Build Windows installer and portable zip
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          pnpm exec electron-builder --win nsis zip --publish never

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $productName = (Get-Content package.json | ConvertFrom-Json).build.productName
          pnpm run test:packaged "release/win-unpacked/$productName.exe"

      - name: Preserve failed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-acceptance
          path: test-results/
          if-no-files-found: ignore

      # Draft first and published last, so nobody (and no auto-updater) ever sees
      # a release that is still missing its installer.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $productName = $pkg.build.productName
          $version = $pkg.version
          $paths = @(
            "release/latest.yml",
            "release/$productName-$version-Setup.exe",
            "release/$productName-$version-Setup.exe.blockmap",
            "release/$productName-$version-portable.zip"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "PlatHelper $env:TAG" `
              --draft `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $env:TAG" }
          }

          gh release upload $env:TAG $paths --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets" }

          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $env:TAG" }
          Write-Host "Published $env:TAG"
